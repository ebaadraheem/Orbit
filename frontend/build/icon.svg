<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rounded-square app-icon ground, matching the app's charcoal surface. -->
    <clipPath id="mask">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
    <radialGradient id="ground" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#17191d" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fb9a8" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#8fb9a8" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#8fb9a8" stop-opacity="0" />
    </radialGradient>
    <path id="ring" d="M 256 256 m -168 0 a 168 64 0 1 0 336 0 a 168 64 0 1 0 -336 0" />
  </defs>

  <g clip-path="url(#mask)">
    <rect width="512" height="512" fill="url(#ground)" />
    <circle cx="256" cy="256" r="190" fill="url(#glow)" />

    <g transform="rotate(-17 256 256)">
      <use href="#ring" fill="none" stroke="#8fb9a8" stroke-width="3.5" opacity="0.55" stroke-linecap="round" />
      <!-- Satellite, parked at the ring's rightmost point. -->
      <circle cx="424" cy="256" r="10" fill="#8fb9a8" />
    </g>

    <!-- Core. -->
    <circle cx="256" cy="256" r="28" fill="#8fb9a8" />
  </g>
</svg>
